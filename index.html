<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="株式会社 吉源商事の公式ホームページ。金属スクラップ買取、選別、保管、輸出に関する企業情報を掲載しています。">
    <title data-title-key="home.metaTitle">株式会社 吉源商事｜金属リサイクル・資源循環</title>
    <link rel="stylesheet" href="css/style.css?v=11">
</head>

<body data-page="home">
    <header class="site-header" data-active-page="home">
        <div class="scroll-progress" aria-hidden="true"></div>
        <div class="header-inner">
            <a class="brand" href="index.html" aria-label="Yoshigen Shoji home">
                <span class="brand-mark"></span>
                <span><strong data-i18n="common.companyName">株式会社 吉源商事</strong><small
                        data-i18n="common.tagline"></small></span>
            </a>
            <button class="menu-toggle" type="button" aria-label="Open navigation"
                aria-expanded="false"><span></span><span></span><span></span></button>
            <nav class="site-nav" aria-label="Main navigation"><a href="index.html" data-nav="home"
                    data-i18n="common.nav.home">トップ</a>
                <a href="company.html" data-nav="company" data-i18n="common.nav.company">企業情報</a>
                <a href="products.html" data-nav="products" data-i18n="common.nav.products">取扱商品</a>
                <a href="facilities.html" data-nav="facilities" data-i18n="common.nav.facilities">設備・実例</a>
                <a href="gallery.html" data-nav="gallery" data-i18n="common.nav.gallery">ギャラリー</a>
                <a href="contact.html" data-nav="contact" data-i18n="common.nav.contact">お問い合わせ</a>
            </nav>
            <div class="lang-switch" aria-label="Language switch">
                <button type="button" data-lang="ja">日本語</button>
                <button type="button" data-lang="zh">中文</button>
                <button type="button" data-lang="en">English</button>
            </div>
        </div>
    </header>
    <main>
        <section class="eco-hero">
            <div id="lpCarousel" class="hero-carousel">
                <div class="hero-track">
                    <div class="hero-slide active">
                        <div class="hero-shade" aria-hidden="true"></div>
                        <canvas class="motion-canvas" aria-hidden="true"></canvas>
                        <div class="container hero-layout">
                            <div class="hero-copy">
                                <p class="section-kicker" data-i18n="home.heroKicker"></p>
                                <h1 data-i18n="home.heroTitle"></h1>
                                <p class="hero-lead" data-i18n="home.heroLead"></p>
                                <div class="hero-actions">
                                    <a class="btn btn-primary" href="products.html" data-i18n="home.heroPrimary"></a>
                                    <a class="btn btn-outline" href="company.html" data-i18n="home.heroSecondary"></a>
                                </div>
                                <div class="hero-quick" data-render="heroServices"></div>
                            </div>
                            <div class="engineering-label" aria-hidden="true"><span>01 / MATERIAL
                                    ENGINEERING</span><strong>価値を、次へ。</strong><span>YOSHIGEN SHOJI</span></div>
                        </div>
                    </div>
                </div>
            </div>
        </section>
        <section class="section product-showcase">
            <div class="container">
                <div class="catalog-heading">
                    <div>
                        <p class="section-kicker">MATERIAL COLLECTION / 09</p>
                        <h2 class="section-title" data-i18n="home.productsTitle"></h2>
                    </div><a class="text-link" href="products.html" data-i18n="home.heroPrimary"></a>
                </div>
                <div class="product-grid" data-render="homeProducts"></div>
                <p class="photo-note" data-i18n="products.photoNote"></p>
            </div>
        </section>
        <section class="section split-section">
            <div class="container split-grid">
                <div class="orbital-card tilt-card">
                    <img src="images/technical/engineering.jpg" alt="" loading="lazy" width="800" height="600">
                </div>
                <div>
                    <p class="section-kicker">ABOUT</p>
                    <h2 class="section-title" data-i18n="home.aboutTitle"></h2>
                    <p class="body-text" data-i18n="home.aboutText"></p>
                </div>
            </div>
        </section>
        <section class="section section-soft">
            <div class="container">
                <div class="section-heading">
                    <p class="section-kicker">SERVICE</p>
                    <h2 class="section-title" data-i18n="home.servicesTitle"></h2>
                </div>
                <div class="feature-grid" data-render="homeServices"></div>
            </div>
        </section>
        <section class="section">
            <div class="container">
                <div class="section-heading">
                    <p class="section-kicker">FLOW</p>
                    <h2 class="section-title" data-i18n="home.flowTitle"></h2>
                </div>
                <div class="flow-line" data-render="homeFlow"></div>
            </div>
        </section>
        <section class="section page-links-section">
            <div class="container">
                <p class="section-kicker">EXPLORE</p>
                <h2 class="section-title compact-title" data-i18n="common.relatedTitle"></h2>
                <div class="page-link-grid"><a class="page-link-card" href="company.html"><span
                            data-i18n="common.nav.company"></span><b>→</b></a>
                    <a class="page-link-card" href="products.html"><span
                            data-i18n="common.nav.products"></span><b>→</b></a>
                    <a class="page-link-card" href="facilities.html"><span
                            data-i18n="common.nav.facilities"></span><b>→</b></a>
                    <a class="page-link-card" href="gallery.html"><span
                            data-i18n="common.nav.gallery"></span><b>→</b></a>
                    <a class="page-link-card" href="contact.html"><span
                            data-i18n="common.nav.contact"></span><b>→</b></a>
                </div>
            </div>
        </section>
    </main>
    <section class="site-cta">
        <div class="container cta-inner">
            <div>
                <p class="section-kicker">CONTACT</p>
                <h2 data-i18n="common.ctaTitle"></h2>
                <p data-i18n="common.ctaText"></p>
            </div>
            <a class="btn btn-light" href="contact.html" data-i18n="common.ctaButton"></a>
        </div>
    </section>
    <footer class="site-footer">
        <div class="container footer-grid">
            <div>
                <p class="footer-brand" data-i18n="common.companyName"></p>
                <p data-i18n="common.footerLead"></p><small data-i18n="common.footerNote"></small>
            </div>
            <p class="copyright" data-i18n="common.copyright"></p>
        </div>
    </footer>
    <script src="js/i18n.js?v=12"></script>
    <script src="js/main.js?v=10"></script>
</body>

</html>
