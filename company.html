<!doctype html>

<body data-page="company">
<header class="site-header" data-active-page="company">
    <div class="scroll-progress" aria-hidden="true"></div>
    <div class="header-inner">
        <a class="brand" href="index.html" aria-label="Yoshigen Shoji home">
            <span class="brand-mark"></span>
            <span><strong data-i18n="common.companyName">株式会社 吉源商事</strong><small data-i18n="common.tagline"></small></span>
        </a>
        <button class="menu-toggle" type="button" aria-label="Open navigation" aria-expanded="false"><span></span><span></span><span></span></button>
        <nav class="site-nav" aria-label="Main navigation"><a href="index.html" data-nav="home" data-i18n="common.nav.home">トップ</a>
<a href="company.html" data-nav="company" data-i18n="common.nav.company">企業情報</a>
<a href="products.html" data-nav="products" data-i18n="common.nav.products">取扱商品</a>

<a href="contact.html" data-nav="contact" data-i18n="common.nav.contact">お問い合わせ</a></nav>
        <div class="lang-switch" aria-label="Language switch">

            <button type="button" data-lang="zh">中文</button>
            <button type="button" data-lang="en">English</button>

<main><section class="page-hero">
    <div class="page-hero-bg"></div>
    <canvas class="page-canvas motion-canvas-small" aria-hidden="true"></canvas>
    <div class="container page-hero-inner">
        <p class="section-kicker" data-i18n="company.pageKicker"></p>
        <h1 data-i18n="company.pageTitle"></h1>
        <p data-i18n="company.pageLead"></p>
    </div>
</section>
    <section class="section message-section"><div class="container message-layout">
        <div class="message-heading"><p class="section-kicker">MESSAGE</p><h2 class="section-title" data-i18n="company.messageTitle"></h2></div>
        <article class="message-panel tilt-card">
            <span class="message-quote">“</span>
            <p class="body-text" data-i18n="company.messageText"></p>
            <p class="message-signature" data-i18n="company.messageSignature"></p>
        </article>
    </div></section>
    <section class="section section-soft"><div class="container"><div class="section-heading"><p class="section-kicker">PROFILE</p><h2 class="section-title" data-i18n="company.outlineTitle"></h2></div><div class="info-table" data-render="companyOutline"></div></div></section>

<a class="page-link-card" href="facilities.html"><span data-i18n="common.nav.facilities"></span><b>→</b></a>
<a class="page-link-card" href="gallery.html"><span data-i18n="common.nav.gallery"></span><b>→</b></a>
<a class="page-link-card" href="contact.html"><span data-i18n="common.nav.contact"></span><b>→</b></a></div>
    </div>

</main>

    <div class="container cta-inner">
        <div><p class="section-kicker">CONTACT</p><h2 data-i18n="common.ctaTitle"></h2><p data-i18n="common.ctaText"></p></div>

    </div>
</section>
<footer class="site-footer">
    <div class="container footer-grid">
        <div><p class="footer-brand" data-i18n="common.companyName"></p><p data-i18n="common.footerLead"></p><small data-i18n="common.footerNote"></small></div>
        <a class="photo-credits-link" href="photo-credits.html" data-i18n="common.photoCredits">写真の出典</a>
