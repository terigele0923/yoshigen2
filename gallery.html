<!doctype html>
<html lang="ja">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="株式会社 吉源商事の公式ホームページ。金属スクラップ買取、選別、保管、輸出に関する企業情報を掲載しています。">
    <title data-title-key="gallery.metaTitle">ギャラリー｜株式会社 吉源商事</title>
    <link rel="stylesheet" href="css/style.css?v=11">
</head>

<body data-page="gallery">
    <header class="site-header" data-active-page="gallery">
        <div class="scroll-progress" aria-hidden="true"></div>
        <div class="header-inner">
            <a class="brand" href="index.html" aria-label="Yoshigen Shoji home">
                <span class="brand-mark"></span>
                <span><strong data-i18n="common.companyName">株式会社 吉源商事</strong><small
                        data-i18n="common.tagline"></small></span>
            </a>
            <button class="menu-toggle" type="button" aria-label="Open navigation"
                aria-expanded="false"><span></span><span></span><span></span></button>
            <nav class="site-nav" aria-label="Main navigation"><a href="index.html" data-nav="home"
                    data-i18n="common.nav.home">トップ</a>
                <a href="company.html" data-nav="company" data-i18n="common.nav.company">企業情報</a>
                <a href="products.html" data-nav="products" data-i18n="common.nav.products">取扱商品</a>
                <a href="facilities.html" data-nav="facilities" data-i18n="common.nav.facilities">設備・実例</a>
                <a href="gallery.html" data-nav="gallery" data-i18n="common.nav.gallery">ギャラリー</a>
                <a href="contact.html" data-nav="contact" data-i18n="common.nav.contact">お問い合わせ</a>
            </nav>
            <div class="lang-switch" aria-label="Language switch">
                <button type="button" data-lang="ja">日本語</button>
                <button type="button" data-lang="zh">中文</button>
                <button type="button" data-lang="en">English</button>
            </div>
        </div>
    </header>
    <main>
        <section class="page-hero">
            <div class="page-hero-bg"></div>
            <canvas class="page-canvas motion-canvas-small" aria-hidden="true"></canvas>
            <div class="container page-hero-inner">
                <p class="section-kicker" data-i18n="gallery.pageKicker"></p>
                <h1 data-i18n="gallery.pageTitle"></h1>
                <p data-i18n="gallery.pageLead"></p>
            </div>
        </section>
        <section class="section section-soft">
            <div class="container">
                <div class="gallery-grid" data-render="gallery"></div>
            </div>
        </section>
        <section class="section page-links-section">
            <div class="container">
                <p class="section-kicker">EXPLORE</p>
                <h2 class="section-title compact-title" data-i18n="common.relatedTitle"></h2>
                <div class="page-link-grid"><a class="page-link-card" href="index.html"><span
                            data-i18n="common.nav.home"></span><b>→</b></a>
                    <a class="page-link-card" href="company.html"><span
                            data-i18n="common.nav.company"></span><b>→</b></a>
                    <a class="page-link-card" href="products.html"><span
                            data-i18n="common.nav.products"></span><b>→</b></a>
                    <a class="page-link-card" href="facilities.html"><span
                            data-i18n="common.nav.facilities"></span><b>→</b></a>
                    <a class="page-link-card" href="contact.html"><span
                            data-i18n="common.nav.contact"></span><b>→</b></a>
                </div>
            </div>
        </section>
    </main>
    <section class="site-cta">
        <div class="container cta-inner">
            <div>
                <p class="section-kicker">CONTACT</p>
                <h2 data-i18n="common.ctaTitle"></h2>
                <p data-i18n="common.ctaText"></p>
            </div>
            <a class="btn btn-light" href="contact.html" data-i18n="common.ctaButton"></a>
        </div>
    </section>
    <footer class="site-footer">
        <div class="container footer-grid">
            <div>
                <p class="footer-brand" data-i18n="common.companyName"></p>
                <p data-i18n="common.footerLead"></p><small data-i18n="common.footerNote"></small>
            </div>
            <p class="copyright" data-i18n="common.copyright"></p>
        </div>
    </footer>
    <script src="js/i18n.js?v=10"></script>
    <script src="js/main.js?v=10"></script>
</body>

</html>
